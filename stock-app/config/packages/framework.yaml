framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false
    handle_all_throwables: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        use_cookies: true
        cookie_lifetime: 86400
        cookie_path: /
        cookie_domain: null
        cookie_httponly: true
    php_errors:
        log: true

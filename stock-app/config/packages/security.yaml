security:
    enable_authenticator_manager: true
    password_hashers:
        App\Entity\User:
            algorithm: auto
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            pattern: ^/
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: dashboard
            logout:
                path: logout
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: false
            context: true
            custom_authenticators:
                - App\Security\TokenAuthenticator
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/confirm-password, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/profile, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/dashboard, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/families, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/sub-familles, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/units, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/packagings, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/vats, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/suppliers, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/articles, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/inventory, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/entries, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/users, roles: ROLE_ADMIN }
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN
